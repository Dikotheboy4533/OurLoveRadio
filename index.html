<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Love Radio</title>
  <style>
    :root {
      --bg: #faf9f6;
      --card: #ffffff;
      --text: #2c2c2c;
      --muted: #767676;
      --accent: #d47386;
      --border: #eae6e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px 16px;
    }

    .player {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header small {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      display: block;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .display {
      background: #fbfaf8;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .freq {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .station {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .desc {
      font-size: 13px;
      color: var(--muted);
    }

    .song-info {
      text-align: center;
      margin-bottom: 20px;
      min-height: 44px;
    }

    .song-info strong {
      font-size: 14px;
      display: block;
      margin-bottom: 4px;
    }

    .song-info p {
      font-size: 12px;
      color: var(--muted);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    button {
      background: none;
      border: 1px solid var(--border);
      cursor: pointer;
      font-family: inherit;
      border-radius: 50%;
      display: grid;
      place-items: center;
      transition: all 0.2s ease;
    }

    button:hover {
      border-color: var(--text);
    }

    .control {
      width: 40px;
      height: 40px;
      font-size: 14px;
      color: var(--text);
    }

    .control.main {
      width: 56px;
      height: 56px;
      background: var(--text);
      color: #fff;
      border: none;
      font-size: 16px;
    }

    .control.main:hover {
      background: #444;
    }

    .progress-container {
      margin-bottom: 24px;
    }

    .seek {
      width: 100%;
      accent-color: var(--accent);
      height: 4px;
      cursor: pointer;
    }

    .times {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    .stations {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .preset {
      padding: 10px 12px;
      border-radius: 8px;
      background: #fbfaf8;
      border: 1px solid var(--border);
      text-align: left;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
    }

    .preset span {
      display: block;
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .preset.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .preset.active span {
      color: #aaa;
    }

    .hint {
      text-align: center;
      font-size: 11px;
      color: var(--accent);
      margin-top: 12px;
      min-height: 16px;
    }
  </style>
</head>
<body>

  <main class="player">
    <header>
      <small>Two Month Anniversary</small>
      <h1>Our Love Radio</h1>
    </header>

    <div class="display">
      <div class="freq" id="frequency">101.1 FM</div>
      <div class="station" id="station">Miss Me FM</div>
      <div class="desc" id="description">For the moments when distance feels far</div>
    </div>

    <div class="song-info">
      <strong id="track">Choose a station</strong>
      <p id="dedication">Press play</p>
    </div>

    <div class="controls">
      <button class="control" id="prev" aria-label="Previous song">◄◄</button>
      <button class="control main" id="play" aria-label="Play">▶</button>
      <button class="control" id="next" aria-label="Next song">►►</button>
    </div>

    <div class="progress-container">
      <input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Song progress">
      <div class="times">
        <span id="elapsed">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="stations" id="presets"></div>
    <div class="hint" id="status" role="status" aria-live="polite"></div>
  </main>

  <audio id="audio" preload="none"></audio>

  <script>
    const stations = [
      {name:'Miss Me FM',frequency:'101.1 FM',description:'For the moments when 9447 km feel farther than it is',songs:[{title:'Hey There Delilah',file:'miss-me-1.mp3',message:'Don\'t worry about the distance baby'},{title:'Hold On',file:'miss-me-2.mp3',message:'There isnt a life for me, without you in it'},{title:'If the World was Ending',file:'miss-me-3.mp3',message:'Even when things go wrong, Ill stay'}]},
      {name:'Sleepy FM',frequency:'102.2 FM',description:'A soft corner for you to rest',songs:[{title:'Sailor Song',file:'sleepy-1.mp3',message:'Close your eyes and listen, bebeee'}]},
      {name:'Happy FM',frequency:'103.3 FM',description:'For the happy days where u feel good',songs:[{title:'Arz Kiya Hai',file:'happy-1.mp3',message:'Tu he meri jaan'},{title:'Let me Love you',file:'happy-2.mp3',message:'Let me love you, even when the world is against us'}]},
      {name:'Us FM',frequency:'104.4 FM',description:'Tells our story, my love',songs:[{title:'Belong Together',file:'us-1.mp3',message:'We belong together mi amor'},{title:'If we have each other',file:'us-2.mp3',message:'We only need each other'},{title:'All of me',file:'us-3.mp3',message:'I love every part of you'}]},
      {name:'Future FM',frequency:'105.5 FM',description:'Two months down, a lifetime to go',songs:[{title:'Perfect',file:'future-1.mp3',message:'You are truly perfect in my eyes'},{title:'Rewrite the Stars',file:'future-2.mp3',message:'I would do anything for you'},{title:'Until I Found You',file:'future-3.mp3',message:'You are the love of my life'}]},
      {name:'Special FM',frequency:'143.2 FM',description:'A special message, just for you',songs:[{title:'A message from me',file:'secret-message.mp3',message:'Happy two months, my love.'}]}
    ];

    const $ = id => document.getElementById(id), audio = $('audio');
    let stationIndex = 0, trackIndex = 0, playToken = 0;
    const presets = $('presets');
    const fmt = n => Number.isFinite(n) ? `${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}` : '0:00';

    stations.forEach((s, i) => {
      const b = document.createElement('button');
      b.className = 'preset';
      b.innerHTML = `<span>${s.frequency}</span>${s.name}`;
      b.onclick = () => selectStation(i);
      presets.appendChild(b);
    });

    function sync() {
      const s = stations[stationIndex], t = s.songs[trackIndex];
      $('frequency').textContent = s.frequency;
      $('station').textContent = s.name;
      $('description').textContent = s.description;
      $('track').textContent = t.title;
      $('dedication').textContent = t.message;
      [...presets.children].forEach((b, i) => {
        b.classList.toggle('active', i === stationIndex);
      });
      $('seek').value = 0;
      $('elapsed').textContent = '0:00';
      $('duration').textContent = '0:00';
      $('status').textContent = '';
      ++playToken;
      audio.pause();
      audio.src = t.file;
      audio.load();
      setPlaying(false);
    }

    function setPlaying(v) {
      $('play').textContent = v ? '❚❚' : '▶';
    }

    async function play() {
      const token = playToken;
      try {
        await audio.play();
        if (token === playToken) $('status').textContent = '';
      } catch (e) {
        if (token === playToken) {
          setPlaying(false);
          $('status').textContent = 'Audio file not found.';
        }
      }
    }

    function selectStation(i) {
      stationIndex = i;
      trackIndex = 0;
      sync();
      play();
    }

    function changeTrack(n) {
      trackIndex = (trackIndex + n + stations[stationIndex].songs.length) % stations[stationIndex].songs.length;
      sync();
      play();
    }

    $('play').onclick = () => audio.paused ? play() : audio.pause();
    $('prev').onclick = () => { if (audio.currentTime > 3) { audio.currentTime = 0; } else { changeTrack(-1); } };
    $('next').onclick = () => changeTrack(1);

    audio.onplay = () => setPlaying(true);
    audio.onpause = () => setPlaying(false);
    audio.onended = () => {
      if (stations[stationIndex].songs.length > 1) changeTrack(1);
      else { audio.currentTime = 0; setPlaying(false); }
    };
    audio.onerror = () => {
      if (audio.getAttribute('src')) $('status').textContent = 'Audio file not found in directory.';
    };
    audio.ontimeupdate = () => {
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        $('seek').value = Math.round(audio.currentTime / audio.duration * 1000);
        $('elapsed').textContent = fmt(audio.currentTime);
        $('duration').textContent = fmt(audio.duration);
      }
    };
    audio.onloadedmetadata = () => { $('duration').textContent = fmt(audio.duration); };
    $('seek').oninput = e => {
      if (Number.isFinite(audio.duration) && audio.duration > 0)
        audio.currentTime = e.target.value / 1000 * audio.duration;
    };

    sync();
  </script>
</body>
</html>
